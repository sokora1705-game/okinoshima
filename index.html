<style>

html,body{margin:0;padding:0}

#app{

}
.page{

h2{font-size:1.25rem}

}

.chip{background:var(--paper);border:2px solid var(--line);border-radius:999px;padding:2px 12px;font-size:.85rem;font-weight:700}

.badge{

  width:72px;height:72px;flex:none;border-radius:50%;

}

.badge.sm{width:44px;height:44px;border-width:2px;box-shadow:0 2px 0 var(--ink)}
.badge.sm::before{inset:4px;border-width:1.5px}
.badge.sm span{font-size:1.05rem}
.badge.shake{animation:shake .45s}

@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px) rotate(-6deg)}40%{transform:translateX(6px) rotate(6deg)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes down{0%{transform:none}40%{transform:scale(1.15) rotate(-8deg)}100%{transform:scale(.95)}}

.witness{display:flex;align-items:center;gap:14px}
.wname{font-size:1.25rem;font-weight:900}
.wsub{font-size:.85rem;color:var(--ink-soft)}

.bubble::before{content:"";position:absolute;top:-14px;left:32px;border:12px solid transparent;border-bottom-color:var(--ink);border-top:0}
.bubble::after{content:"";position:absolute;top:-9px;left:35px;border:9px solid transparent;border-bottom-color:#fff;border-top:0}
.bubble .num{font-size:.78rem;color:var(--ink-soft);font-weight:700;display:block;margin-bottom:2px}
.dots{display:flex;gap:6px;justify-content:center;margin-top:12px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line);display:block}
.dots i.on{background:var(--rose-deep);transform:scale(1.2)}
.nav{display:flex;gap:10px;margin-top:14px}
.nav .btn{flex:1}
.reaction{margin-top:12px;background:#fff1ee;border:2px solid var(--rose-deep);border-radius:16px;padding:10px 14px;font-size:.95rem}
.reaction b{color:var(--red)}

.seg{padding:10px 14px;border-radius:14px;margin-top:10px;background:#fff;border:2px solid var(--line)}
.seg .tag{display:inline-block;font-size:.75rem;font-weight:900;border-radius:999px;padding:0 10px;margin-bottom:4px}
.seg.honne .tag{background:var(--sky)}
.seg.lie{border-color:var(--rose-deep);background:#fff4f1}
.seg.lie .tag{background:var(--rose)}
.seg.clue{border-color:var(--leaf-deep);background:#f3faee}
.seg.clue .tag{background:var(--leaf)}
.seg.fade{animation-duration:.5s}
.explain{white-space:pre-line}
.reveal-name{color:var(--red);font-weight:900}

.stamp{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:50;pointer-events:none;background:rgba(251,243,226,.4)}
.stamp span{font-size:3rem;font-weight:900;color:var(--red);border:7px solid var(--red);border-radius:20px;padding:6px 26px;background:rgba(255,255,255,.92);transform:rotate(-10deg);animation:stamp .5s cubic-bezier(.2,1.6,.4,1) both}
.stamp.bad span{color:var(--ink-soft);border-color:var(--ink-soft);font-size:2.1rem}
@keyframes stamp{from{transform:rotate(-10deg) scale(2.4);opacity:0}to{transform:rotate(-10deg) scale(1);opacity:1}}

.modal{position:fixed;inset:0;z-index:40;background:rgba(74,54,40,.45);display:flex;align-items:flex-end;justify-content:center;animation:fadeOnly .2s both}
@keyframes fadeOnly{from{opacity:0}to{opacity:1}}
.sheet{width:100%;max-width:560px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--paper);border-radius:26px 26px 0 0;border:3px solid var(--line);border-bottom:0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));animation:up .28s ease both}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (min-width:600px){.modal{align-items:center}.sheet{border-radius:26px;border-bottom:3px solid var(--line)}}
.quote{background:#fff;border-radius:14px;padding:8px 12px;font-size:.92rem;border-left:5px solid var(--red);margin:8px 0 12px}
.ev-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ev{appearance:none;border:2.5px solid var(--line);background:#fff;border-radius:16px;padding:10px 4px 8px;cursor:pointer;text-align:center;font-size:.78rem;font-weight:700;line-height:1.35;min-height:92px}
.ev .ic{font-size:1.8rem;display:block;line-height:1.2;margin-bottom:4px}
.ev.sel{border-color:var(--red);background:#fff1ee;box-shadow:0 0 0 3px rgba(217,96,79,.2)}
.ev-detail{margin-top:12px;background:#fff;border-radius:16px;padding:12px 14px;border:2px solid var(--line);min-height:84px;font-size:.95rem}
.ev-detail b{display:block;margin-bottom:2px}
.memo h3{margin:16px 0 6px;font-size:1rem}
.memo h3:first-of-type{margin-top:10px}
.memo ul{margin:0;padding-left:1.2em;font-size:.92rem}
.memo li{margin:3px 0}
.ev-row{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;padding:8px 10px;margin:6px 0;font-size:.9rem}
.ev-row .ic{font-size:1.5rem;line-height:1.2}

.guess{margin-top:8px;background:#fff;border:2.5px dashed var(--sea);border-radius:16px;padding:12px 14px}
.guess p{font-size:.9rem;margin:0 0 8px}
.guess input{width:100%;font-size:1rem;padding:10px 12px;border-radius:12px;border:2px solid var(--line);background:#fffdf8}
.guess .btn{margin-top:8px;width:100%}
.guess .result{font-weight:700}

.title-page{text-align:center;padding:34px 20px 26px}
.title-page .pic{font-size:3.8rem}
.title-page h1{font-size:1.85rem;margin:6px 0 4px}
.title-page .sub{color:var(--ink-soft);font-size:.95rem;margin-bottom:22px}
.wave{height:22px;margin:4px auto 16px;max-width:240px;background:radial-gradient(circle at 10px -4px, transparent 12px, var(--sky) 13px) 0 0/20px 22px repeat-x;opacity:.8}

.qlabel{display:inline-block;background:var(--ink);color:var(--paper);border-radius:999px;padding:0 14px;font-size:.85rem;font-weight:700;margin-bottom:8px}

/* エンディング */
.mino-wrap{position:relative;height:110px;display:flex;align-items:center;justify-content:center}
.mino{font-size:3.6rem}
.mino.fall{animation:minoFall 1.4s ease both}
@keyframes minoFall{0%{opacity:1;transform:none}100%{opacity:0;transform:translateY(50px) rotate(35deg)}}
.speaker{font-weight:900;font-size:.9rem;color:var(--ink-soft)}
.line{margin:10px 0}
.line.say{background:#fff;border-radius:16px;padding:10px 14px;border:2px solid var(--line)}
.owari{font-size:1.6rem;font-weight:900;letter-spacing:.3em;text-align:center;margin:20px 0 6px}

.curtain{position:fixed;inset:0;background:#2a2018;z-index:45;pointer-events:none;animation:curtain 1.6s ease both}
@keyframes curtain{0%{opacity:0}35%{opacity:1}65%{opacity:1}100%{opacity:0}}
.book{
  margin:6px auto 0;width:min(78vw,300px);aspect-ratio:3/4;border-radius:10px 18px 18px 10px;
  background:linear-gradient(160deg,#fde3d9,#f7c6b8);border:4px solid var(--ink);
  box-shadow:-10px 0 0 #c98b6f inset, 0 10px 0 rgba(74,54,40,.2);
  position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;
  animation:bookIn 1.2s .6s cubic-bezier(.2,1.2,.4,1) both;transform-origin:left center;
}
@keyframes bookIn{from{opacity:0;transform:perspective(800px) rotateY(-90deg)}to{opacity:1;transform:none}}
.book .cover-title{font-size:2.3rem;font-weight:900;letter-spacing:.12em;color:#7a2a20;margin-top:6px}
.book .cover-art{width:62%}
.book .cover-sub{font-size:.8rem;color:#7a4a3a;margin-top:4px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.card{perspective:700px;height:128px}
.card .in{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:flip .8s ease forwards;animation-delay:var(--d)}
@keyframes flip{to{transform:rotateY(180deg)}}
.face{position:absolute;inset:0;border-radius:16px;border:2.5px solid var(--ink);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;backface-visibility:hidden;-webkit-backface-visibility:hidden;font-size:.8rem;font-weight:700;text-align:center;padding:4px;line-height:1.3}
.face.back{transform:rotateY(180deg);background:#fff6e8}
.face .real{font-size:1rem;font-weight:900;color:var(--red)}
.face .big{font-size:2.2rem;line-height:1.1}
.face svg{width:58px;height:58px}
.kid-big{width:150px;height:150px;margin:0 auto;display:block;animation:fade 1s .2s both}
.share-note{font-size:.8rem;color:var(--ink-soft);text-align:center;margin-top:6px}

/* おすすめ枠（PR） */
.tabs{display:flex;gap:6px;margin:10px 0 4px;border-bottom:2px solid var(--line)}
.tab{appearance:none;border:2px solid var(--line);border-bottom:0;background:#f5e7cc;border-radius:12px 12px 0 0;padding:6px 14px;font-size:.9rem;font-weight:700;cursor:pointer;margin-bottom:-2px}
.tab.on{background:var(--paper);border-color:var(--line);color:var(--ink)}
.pr-list{display:flex;flex-direction:column;gap:10px;margin-top:10px}

.pr-body{flex:1;min-width:0;font-size:.85rem;line-height:1.5}

.pr-body .meta{color:var(--ink-soft);font-size:.78rem}
.pr-tag{position:absolute;top:6px;right:8px;font-size:.68rem;font-weight:900;letter-spacing:.05em;color:#fff;background:var(--ink-soft);border-radius:6px;padding:0 6px;line-height:1.6}

.ad-note{margin-top:auto;padding-top:18px;text-align:center;font-size:.75rem;color:var(--ink-soft)}
</style>

<div id="app"></div>

<script>
/* =========================================================
   表に出してよいデータ（概要・証言・証拠）
   ========================================================= */
const EVIDENCE = [
  {id:'dango',  no:'①', icon:'🍡', name:'仲間の旅だんご',   text:'若者は「仲間になるなら」と旅だんごをひとつずつ渡した。シロ・マシラ・ケーンは、それぞれひとつもらって仲間になった。'},
  {id:'fune',   no:'②', icon:'⛵', name:'沖の島への船',     text:'沖の島は海の向こうにあり、船でしか渡れない。一行は船で渡り、船で帰ってきた。'},
  {id:'ikusa',  no:'③', icon:'⚔️', name:'島での戦いぶり',   text:'シロは大男の足に食らいつき、マシラは飛びかかってかきむしり、ケーンは上から大男たちの目を突いた。'},
  {id:'kousan', no:'④', icon:'🙇', name:'大男たちの降参',   text:'島の大男たちは泣いて謝り、二度と悪さをしないと誓って、自分から宝を差し出した。'},
  {id:'kuruma', no:'⑤', icon:'🛞', name:'帰りの荷車',       text:'シロが前で引き、マシラが後ろから押し、ケーンが綱を引いた。若者は荷車の先を歩いた。'},
  {id:'oitachi',no:'⑥', icon:'🌊', name:'若者の生い立ち',   text:'若者は、おばあさんが川で拾ってきた子。子のいなかったおじいさんとおばあさんが、わが子として大事に育てた。'},
];
const evById = id => EVIDENCE.find(e => e.id === id);

const TREASURES = [['🥇','金の延べ棒'],['🥈','銀の延べ棒'],['🪸','珊瑚'],['🔮','瑪瑙の玉'],['🧵','宝の反物'],['🔨','打ち出の小槌'],['👒','隠れ笠']];
const CAST = [
  {badge:'若', c:'#f8e6b8', name:'若者', text:'おばあさんが育てた子。仲間を連れて沖の島へ渡り、島の大男たちを打ち負かした。仲間からは「若さま」と呼ばれる。'},
  {badge:'シ', c:'#f4efe6', name:'シロ', text:'若者の最初の仲間。力持ち。'},
  {badge:'マ', c:'#f3c9a6', name:'マシラ', text:'二番目の仲間。身軽ですばしっこい。'},
  {badge:'ケ', c:'#cfe3c4', name:'ケーン', text:'三番目の仲間。いつも高いところから見張っている。'},
  {badge:'ア', c:'#f4b9ad', name:'アカ', text:'沖の島に住む、赤ら顔の大男。'},
];
const badgeHTML = (b, c, cls='') => `<div class="badge ${cls}" style="--c:${c}"><span>${b}</span></div>`;

const INTRO = [
  {pic:'🏝️ ⛵', title:'むかしむかし', body:`

const SEC = (() => {
  const bin = atob(BLOB.join(''));
  const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
  const key = new TextEncoder().encode('oki-no-shima');
  for (let i = 0; i < bytes.length; i++) bytes[i] ^= key[i % key.length] ^ ((i * 7) & 255);
  return JSON.parse(new TextDecoder().decode(bytes));
})();

/* 「この事件の正体は？」の判定 */
function normalizeGuess(raw){
  let s = String(raw || '').normalize('NFKC').toLowerCase();
  s = s.replace(/[āâ]/g,'a').replace(/[īî]/g,'i').replace(/[ūû]/g,'u').replace(/[ēê]/g,'e').replace(/[ōô]/g,'o');
  s = s.replace(/[\s　・･、。,.!！?？「」『』"'`（）()\[\]【】〜~_\-]/g, '');
  s = s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0) - 0x60));
  for (const [a,b] of SEC.bonus.kanji) s = s.split(a).join(b);
  return s;
}
function checkGuess(raw){
  const s = normalizeGuess(raw);
  return s.length > 0 && SEC.bonus.targets.some(t => s.includes(t));
}
const TIER_TITLES = ['千里眼のおばあさん','名探偵のおばあさん','物知りのおばあさん','勘のいいおばあさん'];

function livesHTML(hit){
  let h = '';
  for (let i=0;i<MAX_LIVES;i++) h += `<span class="${i>=S.lives?'lost':''}">${LIFE_ICON}</span>`;
  return `<div class="lives ${hit?'hit':''}" aria-label="ライフ ${S.lives}">${h}</div>`;
}
function topbar(label, hit){
  return `<div class="topbar">${livesHTML(hit)}<span class="chip">${label}</span><button class="btn small" data-act="memo">📖 手帳</button></div>`;
}
function render(opts={}){
  const fn = {title:rTitle, intro:rIntro, testimony:rTestimony, broken:rBroken, final:rFinal, finalOk:rFinalOk, ending:rEnding, gameover:rGameover, recommend:rRecommend}[S.screen];
  let html = fn(opts);
  if (!PR_SCREENS.has(S.screen)) html = html.replace(/<a class="pr-card[\s\S]*?<\/a>/g, ''); // 念のため
  app.innerHTML = html + `<footer class="ad-note">広告を含みます</footer>`;
  if (S.screen==='ending' && S.endStep>0 && !SEC.ending[S.endStep].top) window.scrollTo({top:document.body.scrollHeight, behavior:'smooth'});
  else window.scrollTo({top:0});
}

function shareURL(){
  const lines = [`『${GAME_TITLE}』を解き明かしました！`, `のこりライフ ${LIFE_ICON.repeat(S.lives)}（まちがい ${S.missCount}回）`];
  if (S.guess && S.guess.ok) lines.push(`称号：${TIER_TITLES[S.guess.tier]}`);
  lines.push('#沖の島の宝');
  let q = 'text=' + encodeURIComponent(lines.join('\n'));
  if (/^https?:/.test(location.protocol)) q += '&url=' + encodeURIComponent(location.href.split('#')[0]);
  return 'https://x.com/intent/tweet?' + q;
}

    html += `<div class="curtain"></div><div class="page center">

      </div></div>`).join('')}</div>
      <p class="fade" style="animation-delay:${.6+SEC.cards.length*.35}s">${cur.after}</p>

  // 次へボタン（見破れなかった人には recap を飛ばす）

    ? `<a class="btn dark big" href="${shareURL()}" target="_blank" rel="noopener" data-share>𝕏 結果をXでシェア</a>

let modalEl = null;
function closeModal(){ if (modalEl){ modalEl.remove(); modalEl = null; } }

function openEvidencePicker(quoteHTML, okLabel, onPick){
  closeModal();
  let sel = null;
  modalEl = document.createElement('div');
  modalEl.className = 'modal';
  const draw = () => {
    const e = sel ? evById(sel) : null;
    modalEl.innerHTML = `<div class="sheet" role="dialog" aria-label="証拠をえらぶ">
      <div class="row between"><h3>どの証拠を突きつける？</h3><button class="btn small" data-m="close">とじる</button></div>
      <div class="quote">${quoteHTML}</div>
      <div class="ev-grid">${EVIDENCE.map(x=>`<button class="ev ${sel===x.id?'sel':''}" data-ev="${x.id}"><span class="ic">${x.icon}</span>${x.no}<br>${x.name}</button>`).join('')}</div>
      <div class="ev-detail">${e ? `<b>${e.no} ${e.name}</b>${e.text}` : '<span class="muted">証拠をえらぶと、くわしい内容が出ます。</span>'}</div>
      <div class="actions"><button class="btn objection" data-m="ok" ${sel?'':'disabled'}>${okLabel}</button></div>
    </div>`;
  };
  draw();
  modalEl.addEventListener('click', ev => {
    if (ev.target === modalEl){ closeModal(); return; }
    const b = ev.target.closest('button'); if (!b) return;
    if (b.dataset.ev){ sel = b.dataset.ev; draw(); return; }
    if (b.dataset.m === 'close'){ closeModal(); return; }
    if (b.dataset.m === 'ok' && sel){ const s = sel; closeModal(); onPick(s); }
  });
  document.body.appendChild(modalEl);
}

function guessBoxHTML(){
  const open = (S.screen==='testimony' || S.screen==='broken');
  let inner;
  if (S.guess && S.guess.ok) inner = `<p class="result">🌟 おばあさんは、何かに気づいたようだ……</p><p class="muted" style="margin:0">答えはエンディングで明かされます。</p>`;

  else if (!open) inner = `<p class="muted" style="margin:0">最終推理が始まったので、もう答えられません。</p>`;
  else inner = `<p>この事件には、あなたの知っている「あるお話」がかくれている。<br>そのお話の題名は？<span class="muted">（答えられるのは1回だけ。はずれてもライフは減りません）</span></p>

        ${tabs}
        <p class="muted" style="margin:8px 0 0">推理のひと休みに。おばあさんの本棚から。</p>
        <div class="pr-list">${PR.SHELF.map(it=>prCardHTML(it)).join('')}</div>
        <p class="ad-note">広告を含みます</p>
      </div>`;
      return;
    }
    const clues = S.clues.length ? `<ul>${S.clues.map(c=>`<li>${c}</li>`).join('')}</ul>` : '<p class="muted">まだ手がかりはありません。証言を崩すと、ここに書きとめられます。</p>';
    modalEl.innerHTML = `<div class="sheet memo" role="dialog" aria-label="手帳">
      <div class="row between"><h3>おばあさんの手帳</h3><button class="btn small" data-m="close">とじる</button></div>
      ${tabs}
      ${guessBoxHTML()}
      <h3>事件の概要</h3>
      <ul>
        <li>目録の宝は8品。家で数えると7品で、<b>隠れ蓑</b>がない。</li>
        <li>隠れ蓑は<b>着た者の姿を見えなくする</b>。</li>
        <li>宝は筵にくるんで船 → 浜で荷車 → 家へ。蓑と旅だんごの包みは筵の上。</li>
        <li>旅だんごの包みも消えた。</li>
        <li>若者は荷車の先を歩いていた。</li>
        <li>アカは翌朝、島の舟で着いたところを捕まった。</li>
      </ul>
      <h3>手がかり</h3>${clues}
      <h3>証拠</h3>
      ${EVIDENCE.map(e=>`<div class="ev-row"><span class="ic">${e.icon}</span><div><b>${e.no} ${e.name}</b><br>${e.text}</div></div>`).join('')}
    </div>`;
  };
  draw();
  const submit = () => {
    const inp = modalEl.querySelector('#guessInput');
    if (!inp || !inp.value.trim()) return;
    if (checkGuess(inp.value)){
      S.guess = {ok:true, tier:S.hints};
      S.lives = MAX_LIVES;
      stamp('ひらめいた！');
    } else {
      S.guess = {ok:false};
    }
    draw();
    if (S.screen === 'testimony' || S.screen === 'broken') {
      const top = app.querySelector('.lives'); if (top) top.outerHTML = livesHTML(true);
    }
  };
  modalEl.addEventListener('click', ev => {
    if (ev.target === modalEl || ev.target.closest('[data-m="close"]')){ closeModal(); return; }
    const t = ev.target.closest('[data-tab]');
    if (t){ tab = t.dataset.tab; draw(); return; }
    if (ev.target.closest('[data-m="guess"]')) submit();
  });
  modalEl.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'guessInput' && !ev.isComposing) submit(); });
  document.body.appendChild(modalEl);
}

function stamp(text, bad){
  const el = document.createElement('div');
  el.className = 'stamp' + (bad?' bad':'');
  el.innerHTML = `<span>${text}</span>`;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), bad?700:1100);
}

/* =========================================================
   進行
   ========================================================= */
function loseLife(){
  S.lives--; S.missCount++;
  if (S.lives <= 0){
    S.from = (S.screen==='final') ? 'final' : 'testimony';
    S.screen = 'gameover'; S.reaction = null;
    setTimeout(()=>render(), 700);
    return true;
  }
  return false;
}
function onTestimonyPick(evId){
  const w = WITNESSES[S.w], sw = SEC.w[S.w];
  if (S.s === sw.contra && evId === sw.answer){
    S.reaction = null;
    stamp('崩れた！');
    sw.clues.forEach(c => { if (!S.clues.includes(c)) S.clues.push(c); });
    S.hints = Math.max(S.hints, sw.hint);
    setTimeout(()=>{ S.screen='broken'; render(); }, 1000);
    return;
  }
  S.reaction = (S.s === sw.contra) ? pick(w.wrongEvidence) : pick(w.wrongStatement);
  stamp('ちがうようだ…', true);
  if (!loseLife()) render({hit:true});
}
function onFinalPick(evId){
  const sf = SEC.finals[S.f];
  if (evId === sf.answer){
    S.reaction = null;
    if (S.f === FINALS.length-1){
      stamp('出ておいで…');
      setTimeout(()=>{ S.screen='ending'; S.endStep=0; render(); }, 1100);
    } else {
      stamp('そのとおり！');
      setTimeout(()=>{ S.screen='finalOk'; render(); }, 1000);
    }
    return;
  }
  S.reaction = pick(FINAL_WRONG);
  stamp('ちがうようだ…', true);
  if (!loseLife()) render({hit:true});
}
function nextEndStep(){
  let n = S.endStep + 1;
  // 正体を見破っていない人には「見破ったあなたへ」を出さない
  while (n < SEC.ending.length && SEC.ending[n].mode === 'recap' && !(S.guess && S.guess.ok)) n++;
  if (n < SEC.ending.length){ S.endStep = n; render(); }
}
function restart(){
  Object.assign(S, {screen:'title', page:0, w:0, s:0, lives:MAX_LIVES, clues:[], f:0, reaction:null, endStep:0, missCount:0, hints:0, guess:null, from:null});
  render();
}

app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, w = WITNESSES[S.w];
  switch (a){
    case 'start': S.screen='intro'; S.page=0; render(); break;
    case 'introPrev': if (S.page>0){ S.page--; render(); } break;
    case 'introNext':
      if (S.page < INTRO.length-1){ S.page++; render(); }
      else { S.screen='testimony'; S.w=0; S.s=0; render(); }
      break;
    case 'prevS': S.s = (S.s - 1 + w.statements.length) % w.statements.length; S.reaction=null; render(); break;
    case 'nextS': S.s = (S.s + 1) % w.statements.length; S.reaction=null; render(); break;
    case 'object': openEvidencePicker(`${w.name}「${w.statements[S.s]}」`, '突きつける！', onTestimonyPick); break;
    case 'nextWitness':
      if (S.w < WITNESSES.length-1){ S.w++; S.s=0; S.reaction=null; S.screen='testimony'; }
      else { S.screen='final'; S.f=0; S.reaction=null; }
      render(); break;
    case 'finalPick': {
      const q = FINALS[S.f];
      openEvidencePicker(`<b>${q.label}</b> ${q.title}`, S.f===FINALS.length-1?'これで呼びかける！':'突きつける！', onFinalPick);
      break;
    }
    case 'finalNext': S.f++; S.screen='final'; S.reaction=null; render(); break;
    case 'endNext': nextEndStep(); break;
    case 'memo': openMemo(); break;
    case 'retry':
      S.lives = MAX_LIVES; S.reaction = null;
      S.screen = S.from==='final' ? 'final' : 'testimony';
      if (S.screen==='testimony') S.s = 0;
      render(); break;
    case 'recommend': S.screen='recommend'; render(); break;
    case 'backToEnd': S.screen='ending'; S.endStep=SEC.ending.length-1; render(); break;
    case 'restart': restart(); break;
  }
});
document.addEventListener('keydown', ev => { if (ev.key==='Escape') closeModal(); });

render();
</script>
</body>
</html>
